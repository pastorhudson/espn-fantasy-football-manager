[project]
name = "espn-fantasy-football-manager"
version = "0.1.0"
description = "Automated ESPN fantasy-football team manager"
requires-python = ">=3.13,<3.15"
dependencies = [
    "celery[redis]>=5.6.3,<6",
    "django>=5.2,<5.3",
    "django-celery-beat>=2.8,<3",
    "django-environ>=0.14,<1",
    "gunicorn>=26.2,<27",
    "httpx>=0.28.1,<1",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-django>=4.14,<5",
    "ruff>=0.16.6,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]
